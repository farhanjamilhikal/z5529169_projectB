[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["src/data_access.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/run_part_b.py" = ["E402"]
"scripts/validate_dual_domain_sentiment.py" = ["E402"]
"scripts/build_report.py" = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
