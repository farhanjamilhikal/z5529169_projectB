[server]
headless = true

[browser]
gatherUsageStats = false

# Dark is the only supported theme; there is no light variant to switch to.
[theme]
base = "dark"
showSidebarBorder = true
baseRadius = "medium"
buttonRadius = "medium"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseFontSize = 17
baseFontWeight = 400
chartCategoricalColors = ["#3E9BFF", "#E23E8C", "#8B5CF6", "#3DDC97", "#F0B93D", "#AEB4D6"]

[theme.dark]
# Matches the report cover: deep navy base with a vivid blue/purple/magenta chromatic accent set.
primaryColor = "#E23E8C"
backgroundColor = "#080B14"
secondaryBackgroundColor = "#0E1120"
textColor = "#F5F7FF"
linkColor = "#3E9BFF"
codeTextColor = "#F5F7FF"
codeBackgroundColor = "#1B2340"
borderColor = "#333D63"
dataframeBorderColor = "#333D63"
dataframeHeaderBackgroundColor = "#141A30"
showWidgetBorder = true
greenColor = "#3DDC97"
greenBackgroundColor = "#132A24"
greenTextColor = "#3DDC97"
redColor = "#FF5C7A"
redBackgroundColor = "#2C1620"
redTextColor = "#FF5C7A"
yellowColor = "#F0B93D"
yellowBackgroundColor = "#2B2312"
yellowTextColor = "#F0B93D"
blueColor = "#3E9BFF"
blueBackgroundColor = "#101E33"
blueTextColor = "#3E9BFF"
violetColor = "#8B5CF6"
violetBackgroundColor = "#1E1733"
violetTextColor = "#8B5CF6"
grayColor = "#AEB4D6"
grayBackgroundColor = "#1B2340"
grayTextColor = "#AEB4D6"

[theme.dark.sidebar]
backgroundColor = "#0E1120"
secondaryBackgroundColor = "#1B2340"
textColor = "#F5F7FF"
codeTextColor = "#F5F7FF"
codeBackgroundColor = "#1B2340"
borderColor = "#333D63"
showWidgetBorder = true
