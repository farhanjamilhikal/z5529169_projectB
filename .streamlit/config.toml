[server]
headless = true

[browser]
gatherUsageStats = false

# Global settings that cannot be split between light/dark (per Streamlit docs):
# base color scheme, base font, chart categorical colors, sidebar border visibility.
[theme]
base = "light"
showSidebarBorder = true
baseRadius = "medium"
buttonRadius = "medium"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseFontSize = 17
baseFontWeight = 400
chartCategoricalColors = ["#285F7D", "#7A2638", "#A35B45", "#2F765F", "#C48A24", "#577083"]

[theme.light]
primaryColor = "#7A2638"
backgroundColor = "#F7F0E3"
secondaryBackgroundColor = "#FFFDF8"
textColor = "#263746"
linkColor = "#285F7D"
codeTextColor = "#263746"
codeBackgroundColor = "#E8DDCB"
borderColor = "#B8A992"
dataframeBorderColor = "#B8A992"
dataframeHeaderBackgroundColor = "#EFE4D2"
showWidgetBorder = true
greenColor = "#2F765F"
greenBackgroundColor = "#E6EDE6"
greenTextColor = "#2F765F"
redColor = "#A64B3C"
redBackgroundColor = "#F4E8E1"
redTextColor = "#A64B3C"
yellowColor = "#C48A24"
yellowBackgroundColor = "#F8EFDF"
yellowTextColor = "#C48A24"
blueColor = "#285F7D"
blueBackgroundColor = "#E5EAE9"
blueTextColor = "#285F7D"
violetColor = "#A35B45"
violetBackgroundColor = "#F4EAE3"
violetTextColor = "#A35B45"
grayColor = "#5E6870"
grayBackgroundColor = "#ECEBE8"
grayTextColor = "#5E6870"

[theme.light.sidebar]
backgroundColor = "#FFFDF8"
secondaryBackgroundColor = "#EFE4D2"
textColor = "#263746"
codeTextColor = "#263746"
codeBackgroundColor = "#E8DDCB"
borderColor = "#B8A992"
showWidgetBorder = true

[theme.dark]
# Matches the report cover: deep navy base with a vivid blue/purple/magenta chromatic accent set.
primaryColor = "#E23E8C"
backgroundColor = "#080B14"
secondaryBackgroundColor = "#0E1120"
textColor = "#F5F7FF"
linkColor = "#3E9BFF"
codeTextColor = "#F5F7FF"
codeBackgroundColor = "#1B2340"
borderColor = "#333D63"
dataframeBorderColor = "#333D63"
dataframeHeaderBackgroundColor = "#141A30"
showWidgetBorder = true
greenColor = "#3DDC97"
greenBackgroundColor = "#132A24"
greenTextColor = "#3DDC97"
redColor = "#FF5C7A"
redBackgroundColor = "#2C1620"
redTextColor = "#FF5C7A"
yellowColor = "#F0B93D"
yellowBackgroundColor = "#2B2312"
yellowTextColor = "#F0B93D"
blueColor = "#3E9BFF"
blueBackgroundColor = "#101E33"
blueTextColor = "#3E9BFF"
violetColor = "#8B5CF6"
violetBackgroundColor = "#1E1733"
violetTextColor = "#8B5CF6"
grayColor = "#AEB4D6"
grayBackgroundColor = "#1B2340"
grayTextColor = "#AEB4D6"

[theme.dark.sidebar]
backgroundColor = "#0E1120"
secondaryBackgroundColor = "#1B2340"
textColor = "#F5F7FF"
codeTextColor = "#F5F7FF"
codeBackgroundColor = "#1B2340"
borderColor = "#333D63"
showWidgetBorder = true
