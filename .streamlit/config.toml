[server]
headless = true

[browser]
gatherUsageStats = false

# Global settings that cannot be split between light/dark (per Streamlit docs):
# base color scheme, base font, chart categorical colors, sidebar border visibility.
[theme]
base = "light"
showSidebarBorder = true
baseRadius = "medium"
buttonRadius = "medium"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseFontSize = 17
baseFontWeight = 400
chartCategoricalColors = ["#285F7D", "#7A2638", "#A35B45", "#2F765F", "#C48A24", "#577083"]

[theme.light]
primaryColor = "#7A2638"
backgroundColor = "#F7F0E3"
secondaryBackgroundColor = "#FFFDF8"
textColor = "#263746"
linkColor = "#285F7D"
codeTextColor = "#263746"
codeBackgroundColor = "#E8DDCB"
borderColor = "#B8A992"
dataframeBorderColor = "#B8A992"
dataframeHeaderBackgroundColor = "#EFE4D2"
showWidgetBorder = true
greenColor = "#2F765F"
greenBackgroundColor = "#E6EDE6"
greenTextColor = "#2F765F"
redColor = "#A64B3C"
redBackgroundColor = "#F4E8E1"
redTextColor = "#A64B3C"
yellowColor = "#C48A24"
yellowBackgroundColor = "#F8EFDF"
yellowTextColor = "#C48A24"
blueColor = "#285F7D"
blueBackgroundColor = "#E5EAE9"
blueTextColor = "#285F7D"
violetColor = "#A35B45"
violetBackgroundColor = "#F4EAE3"
violetTextColor = "#A35B45"
grayColor = "#5E6870"
grayBackgroundColor = "#ECEBE8"
grayTextColor = "#5E6870"

[theme.light.sidebar]
backgroundColor = "#FFFDF8"
secondaryBackgroundColor = "#EFE4D2"
textColor = "#263746"
codeTextColor = "#263746"
codeBackgroundColor = "#E8DDCB"
borderColor = "#B8A992"
showWidgetBorder = true

[theme.dark]
primaryColor = "#7A2638"
backgroundColor = "#192A3A"
secondaryBackgroundColor = "#22384A"
textColor = "#FFF9EE"
linkColor = "#396F8C"
codeTextColor = "#FFF9EE"
codeBackgroundColor = "#2D485C"
borderColor = "#577083"
dataframeBorderColor = "#577083"
dataframeHeaderBackgroundColor = "#243D50"
showWidgetBorder = true
greenColor = "#86B0A2"
greenBackgroundColor = "#254352"
greenTextColor = "#86B0A2"
redColor = "#CB978E"
redBackgroundColor = "#313E4E"
redTextColor = "#CB978E"
yellowColor = "#DDBB80"
yellowBackgroundColor = "#34454C"
yellowTextColor = "#DDBB80"
blueColor = "#82A2B4"
blueBackgroundColor = "#244054"
blueTextColor = "#82A2B4"
violetColor = "#CAA093"
violetBackgroundColor = "#31404F"
violetTextColor = "#CAA093"
grayColor = "#A2A7AC"
